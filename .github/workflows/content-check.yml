name: Content checks

on:
  push:
    paths:
      - "**/*.md"
      - "data/evidence.json"
      - "scripts/*.mjs"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/content-check.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "data/evidence.json"
      - "scripts/*.mjs"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/content-check.yml"
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - run: node scripts/validate-catalogue.mjs
      - run: node scripts/render-catalogue.mjs --check

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - run: npx --yes markdownlint-cli2@0.23.1

  local-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: lycheeverse/lychee-action@7da8ec1fc4e01b5a12062ac6c589c10a4ce70d67
        with:
          args: >-
            --offline
            --no-progress
            "./**/*.md"
          fail: true

  external-evidence:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - shell: bash
        run: node scripts/check-evidence-links.mjs 2>&1 | tee check-output.txt
      - if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Evidence link check failed"
          body="The scheduled evidence link check found active sources that need editorial review.

          \`\`\`
          $(tail -40 check-output.txt)
          \`\`\`

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
          fi
